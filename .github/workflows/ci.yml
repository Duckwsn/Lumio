name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumio_test
          POSTGRES_PASSWORD: lumio_ci_only
          POSTGRES_DB: lumio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumio_test -d lumio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace @lumio/server
      - run: npm run db:migrate:deploy --workspace @lumio/server
        env:
          DATABASE_URL: postgresql://lumio_test:lumio_ci_only@127.0.0.1:5432/lumio_test?schema=public
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          LUMIO_TEST_DATABASE_URL: postgresql://lumio_test:lumio_ci_only@127.0.0.1:5432/lumio_test?schema=public
      - run: npm run build
      - run: npm run smoke:production --workspace @lumio/server
        env:
          LUMIO_TEST_DATABASE_URL: postgresql://lumio_test:lumio_ci_only@127.0.0.1:5432/lumio_test?schema=public
      - run: npm run smoke:postgres-flow --workspace @lumio/server
        env:
          LUMIO_TEST_DATABASE_URL: postgresql://lumio_test:lumio_ci_only@127.0.0.1:5432/lumio_test?schema=public
