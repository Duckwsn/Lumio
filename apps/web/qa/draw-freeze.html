<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draw V4 — fixture local de QA</title>
    <style>
      .qa-freeze.app-shell,.qa-freeze .party-main { display:block; width:100%; height:100dvh; min-height:0; overflow:hidden; }
      .qa-freeze .party-workspace { display:flex; width:100%; height:100%; min-height:0; gap:0; }
      .qa-freeze .party-content { display:block; flex:1 1 auto; min-width:0; height:100%; max-height:none; overflow:hidden; }
      .qa-freeze .main-stage.is-game { display:block; width:100%; height:100%; max-height:none; overflow:auto; }
      .qa-freeze .game-hub { width:100%; max-width:1020px; margin:auto; }
      @media (max-width:900px) {
        .qa-freeze .party-workspace { flex-direction:column; }
        .qa-freeze .party-content { flex:1 1 auto; height:auto; min-height:0; }
        .qa-freeze .mobile-party-chat { display:flex; flex:0 0 min(310px,38dvh); width:100%; min-height:0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./draw-freeze.tsx"></script>
  </body>
</html>
