<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lumio FF1.1 — composition studies</title>
<style>
  :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#eef5ef;background:#07100d;--line:#244137;--mint:#9cf4c0;--muted:#9cafa4;--panel:#101c17}
  *{box-sizing:border-box}body{margin:0;min-width:0}button{font:inherit;cursor:default}b,strong{font-weight:680}small,.muted{color:var(--muted)}.caps{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:#a5bdad}.page{min-height:100vh;background:radial-gradient(circle at 80% 0,#18372a 0,transparent 38%),#07100d;display:flex;flex-direction:column}.top{height:66px;padding:0 36px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #254033}.brand{font-weight:800;font-size:22px;letter-spacing:-.06em;display:flex;align-items:center;gap:9px}.mark{display:inline-block;background:var(--mint);width:17px;height:27px;border-radius:9px 9px 6px 6px;position:relative}.mark:after{content:'';position:absolute;width:11px;height:11px;background:var(--mint);right:-9px;bottom:1px;clip-path:polygon(0 0,100% 50%,0 100%)}.topright{display:flex;gap:17px;align-items:center;color:#b4c8b9;font-size:13px}.dot{display:inline-block;width:8px;height:8px;background:var(--mint);border-radius:50%;box-shadow:0 0 16px var(--mint)}.avatar{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#e9b77a;color:#172014;font-weight:750;font-size:12px}.avatar.a2{background:#a5d8bd}.avatar.a3{background:#cdbce8}.avatar.a4{background:#9ac2de}.avstack{display:flex}.avstack .avatar{margin-right:-6px;border:2px solid #13211a}.btn{border:1px solid #5a8067;border-radius:12px;padding:11px 16px;background:transparent;color:#e7f7e9;font-weight:650}.btn.primary{background:var(--mint);border-color:var(--mint);color:#092014}.btn.icon{padding:9px 12px}.frame{width:min(100%,1320px);margin:0 auto;padding:32px 34px}.frame h1{font-size:clamp(31px,4vw,56px);letter-spacing:-.06em;margin:8px 0 13px;line-height:1.02}.hero{border-radius:25px;background:linear-gradient(130deg,#1b4232,#10231b 58%,#0b1712);border:1px solid #37624c;min-height:435px;padding:38px;position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:24px}.hero:before{content:'';width:500px;height:500px;position:absolute;right:-30px;top:-115px;border:1px solid #4a7655;border-radius:50%;box-shadow:0 0 0 80px #a6efb008,0 0 0 160px #a6efb006}.hero>div{position:relative}.hero h2{font-size:clamp(38px,5vw,69px);letter-spacing:-.07em;line-height:1;margin:28px 0 14px;max-width:660px}.hero p{color:#b8d2c0;max-width:520px}.hero .actions{display:flex;gap:12px;margin-top:30px}.presence{align-self:flex-end;background:#10251bcc;border:1px solid #548066;border-radius:18px;padding:16px;min-width:230px}.presence strong{display:block;margin:10px 0}.secondary{display:flex;align-items:center;gap:15px;margin-top:20px;padding:17px 5px;border-bottom:1px solid #203a2d}.secondary .name{flex:1}.secondary small{display:block;margin-top:4px}.minor{margin-top:30px;display:flex;gap:12px}.mini-title{font-size:15px;color:#a6c7ae}.party{flex:1;display:flex;flex-direction:column;min-height:0}.party-title{display:flex;justify-content:space-between;align-items:center;padding:13px 28px;border-bottom:1px solid #244035;gap:12px}.party-title strong{font-size:14px}.stage-layout{display:flex;flex:1;min-height:0;padding:20px 26px;gap:18px}.stage-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}.video{background:radial-gradient(circle at 50% 45%,#24433b,#0c1714 47%,#050806 78%);border:1px solid #2d5140;border-radius:20px;flex:1;min-height:340px;position:relative;display:grid;place-items:center;overflow:hidden}.video:before{content:'';width:min(65vw,800px);height:min(35vw,420px);border-radius:50%;background:radial-gradient(ellipse,#88bc9363,transparent 64%);filter:blur(24px);position:absolute}.play{width:74px;height:74px;border-radius:50%;background:#e8f7e9e6;color:#0c2417;display:grid;place-items:center;font-size:28px;z-index:1}.vid-bottom{position:absolute;bottom:20px;left:24px;right:24px;z-index:1}.bar{height:4px;border-radius:8px;background:#a9c7b366;margin-bottom:16px}.bar:before{content:'';display:block;width:27%;height:100%;border-radius:8px;background:var(--mint)}.controls{display:flex;align-items:center;justify-content:space-between;font-size:14px}.meta{display:flex;justify-content:space-between;align-items:center;padding:15px 4px;gap:15px}.meta strong{display:block}.meta small{display:block;margin-top:3px}.social{width:265px;background:#112019;border:1px solid #294638;border-radius:19px;padding:16px;display:flex;flex-direction:column}.social h3{margin:0 0 18px;font-size:15px}.msg{display:flex;gap:9px;align-items:flex-start;margin:12px 0}.msg p{margin:0;font-size:13px;line-height:1.4}.msg small{font-size:10px}.compose{border:1px solid #385743;border-radius:13px;padding:12px;color:#90a798;font-size:13px;margin-top:auto}.social .avstack{margin:4px 0 22px}.g-hub{min-height:0}.game-feature{display:grid;grid-template-columns:1.1fr .9fr;min-height:375px;border:1px solid #41694e;border-radius:24px;background:linear-gradient(125deg,#1e3c2c,#102018);overflow:hidden}.game-copy{padding:33px}.game-copy h2{font-size:clamp(35px,4vw,58px);letter-spacing:-.07em;line-height:1;margin:36px 0 13px}.game-copy p{max-width:350px;color:#c0d2bd}.game-art{position:relative;background:#e7e6d3;border-radius:16px;margin:17px;display:grid;place-items:center}.game-art span{font-size:160px;transform:rotate(-9deg);filter:drop-shadow(6px 9px 0 #38543b44)}.game-other{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.game-line{padding:22px;border-top:1px solid #345640;display:flex;justify-content:space-between;gap:8px}.game-line strong{display:block;font-size:22px;letter-spacing:-.04em}.game-line p{color:#9fb7a5;font-size:13px}.draw-top{display:flex;align-items:center;gap:15px;padding:13px 24px;border-bottom:1px solid #254235}.draw-top .turn{margin-left:auto;font-size:13px}.draw-top .time{font-size:25px;color:var(--mint);font-weight:750}.draw-grid{display:grid;grid-template-columns:170px minmax(0,1fr) 250px;gap:14px;padding:14px 22px;min-height:0;flex:1}.draw-side,.draw-chat{background:#0e1b15;border:1px solid #2a4738;border-radius:16px;padding:16px}.draw-side{display:flex;flex-direction:column;gap:14px}.draw-side .avstack{margin-top:6px}.toolbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.toolbox span{display:grid;place-items:center;aspect-ratio:1;border-radius:9px;background:#263d30;font-size:20px}.colors{display:flex;flex-wrap:wrap;gap:5px}.colors i{width:22px;height:22px;border-radius:6px;background:#ec735b}.colors i:nth-child(2){background:#f2ca60}.colors i:nth-child(3){background:#8bd4a4}.colors i:nth-child(4){background:#548ad1}.colors i:nth-child(5){background:#b993d9}.colors i:nth-child(6){background:#f5f0db}.canvas-wrap{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}.word{display:flex;justify-content:space-between;align-items:center;padding:0 5px;font-size:14px}.board{background:#f7f7ed;border-radius:16px;border:3px solid #98c9a5;aspect-ratio:4/3;max-height:calc(100vh - 175px);width:100%;display:grid;place-items:center;overflow:hidden}.sketch{font-size:clamp(120px,18vw,245px);transform:rotate(-7deg);filter:grayscale(1) contrast(1.5)}.draw-chat{display:flex;flex-direction:column;min-height:0}.draw-chat h3{margin:0 0 14px;font-size:15px}.draw-chat .compose{margin-top:auto}.score{font-size:12px;color:#9fb6a4}.mobile-only{display:none}
  @media(max-width:600px){.top{height:53px;padding:0 16px}.brand{font-size:19px}.mark{transform:scale(.85)}.topright{font-size:11px;gap:9px}.topright .hide-mobile{display:none}.frame{padding:22px 16px}.frame h1{font-size:33px}.hero{min-height:380px;padding:22px;flex-direction:column}.hero h2{font-size:46px;margin:20px 0 12px}.hero .actions{margin-top:20px}.presence{align-self:stretch;min-width:0;padding:12px}.minor{margin-top:21px}.party-title{padding:11px 15px}.stage-layout{display:flex;flex-direction:column;padding:8px;gap:8px}.stage-main{flex:none}.video{flex:none;min-height:0;aspect-ratio:16/10;border-radius:14px}.video:before{width:270px;height:190px}.play{height:46px;width:46px;font-size:19px}.vid-bottom{bottom:11px;left:12px;right:12px}.bar{margin-bottom:10px}.controls{font-size:11px}.meta{padding:9px 6px}.meta strong{font-size:13px}.social{width:100%;flex:1;min-height:0;border-radius:13px;padding:12px}.social h3{margin-bottom:7px}.social .avstack{margin:0 0 8px}.msg{margin:6px 0}.g-hub .frame{padding-top:16px}.game-feature{display:flex;flex-direction:column;min-height:0}.game-copy{padding:20px}.game-copy h2{font-size:38px;margin:13px 0 5px}.game-copy p{margin:0 0 12px}.game-art{min-height:180px;margin:0 12px 12px}.game-art span{font-size:100px}.game-other{display:block;margin-top:15px}.game-line{padding:15px 0}.draw-top{padding:9px 12px}.draw-top .turn{font-size:11px}.draw-top .time{font-size:19px}.draw-grid{display:flex;flex-direction:column;padding:8px;gap:8px}.draw-side{order:2;padding:9px}.draw-side .avstack,.draw-side .score,.draw-side .caps{display:none}.toolbox{display:flex;justify-content:space-between}.toolbox span{height:36px;width:36px}.draw-side .colors{display:none}.canvas-wrap{order:1;flex:none}.word{font-size:12px}.board{max-height:none}.sketch{font-size:135px}.draw-chat{order:3;padding:11px;min-height:125px}.draw-chat h3{font-size:13px;margin-bottom:4px}.draw-chat .msg{margin:4px 0}.mobile-only{display:block}.desktop-only{display:none}}
  @media(max-width:340px){.frame{padding:15px 10px}.hero{min-height:365px}.hero h2{font-size:39px}.game-art{min-height:140px}.game-copy h2{font-size:34px}.draw-top .turn{display:none}.draw-grid{gap:5px}.board{aspect-ratio:4/3}.draw-chat{min-height:105px}.draw-chat .msg:nth-of-type(2){display:none}}
  /* Pass 2, after viewing all ten first-round captures. */
  .brand{gap:16px}.brand .mark{flex:none}.hero .presence{min-width:275px;padding:22px;align-self:center}.hero .presence strong{font-size:19px}.hero .presence .avstack .avatar{width:43px;height:43px;font-size:15px}
  .sketch-svg{display:block;width:73%;height:73%;max-width:540px;max-height:430px}.sketch-svg path,.sketch-svg circle{stroke:#202824;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}.sketch-svg .eye{fill:#202824;stroke:none}
  .game-art span{font-family:Georgia,serif;font-size:210px;line-height:1;color:#234735;transform:rotate(-38deg);filter:drop-shadow(11px 12px 0 #90a38a)}
  @media(max-width:600px){.brand{gap:11px}.hero .presence{align-self:stretch;min-width:0;padding:13px}.hero .presence strong{font-size:15px}.hero .presence .avstack .avatar{width:32px;height:32px;font-size:12px}.game-art span{font-size:133px}.draw-grid{flex:1}.draw-chat{flex:1;min-height:150px}.draw-chat .compose{margin-top:auto}.sketch-svg{width:80%;height:80%}}
  @media(max-width:340px){.draw-chat{min-height:115px}.draw-chat .msg:nth-of-type(2){display:none}.draw-chat .msg:nth-of-type(3){display:none}}
  @media(min-width:601px) and (max-height:500px){.top{height:46px;padding:0 18px}.party-title{padding:7px 14px}.stage-layout{padding:6px 10px;gap:8px}.video{min-height:0;border-radius:10px}.meta{display:none}.social{width:34%;padding:10px;border-radius:10px}.social h3{margin-bottom:3px}.social .avstack{margin-bottom:4px}.social .msg{margin:4px 0}.social .msg:nth-of-type(3){display:none}.compose{padding:7px}.draw-top{padding:6px 12px}.draw-grid{padding:6px;gap:6px}.board{max-height:calc(100vh - 115px)}.draw-side{width:115px;padding:8px}.draw-chat{width:190px;padding:8px}}
</style></head><body><div id="root"></div><script>
const id=new URLSearchParams(location.search).get('study')||'CS01';
const mark='<span class="mark"></span>';
const avatars='<div class="avstack"><span class="avatar">D</span><span class="avatar a2">M</span><span class="avatar a3">B</span><span class="avatar a4">L</span></div>';
const header=(label,right='● 4 pessoas na Party')=>`<header class="top"><div class="brand">${mark} Lumio</div><div class="topright"><span class="hide-mobile">${label}</span><span class="dot"></span><span>${right}</span><span class="avatar">D</span></div></header>`;
const shell=(label,content,right)=>`<div class="page">${header(label,right)}${content}</div>`;
function home(){return shell('Suas Casas',`<main class="frame"><span class="caps">SEGUNDA-FEIRA • 20:14</span><h1>Tem gente por aqui.</h1><p class="mini-title">Entre onde a conversa já começou.</p><section class="hero"><div><span class="caps"><span class="dot"></span> 3 pessoas agora · 1 Party ativa</span><h2>Noite de<br>sábado</h2><p>Duck, Maya e Bia estão juntos. O som da noite está rolando na Party.</p><div class="actions"><button class="btn primary">Entrar na Casa ↗</button><button class="btn">Ver atividade</button></div></div><div class="presence">${avatars}<strong>A turma está reunida</strong><small>Uma Party em andamento</small></div></section><div class="secondary"><div class="name"><strong>Cinema da turma</strong><small>2 pessoas por perto · sem Party agora</small></div><button class="btn icon">Entrar ↗</button></div><div class="secondary"><div class="name"><strong>Jogos de domingo</strong><small>Sem atividade no momento</small></div><button class="btn icon">Entrar ↗</button></div><div class="minor"><button class="btn">+ Criar Casa</button><button class="btn">Entrar com convite</button></div></main>`,'3 Casas')}
function media(){return shell('Noite de sábado',`<main class="party"><div class="party-title"><strong>Noite de sábado <span class="muted">/ Assistir e ouvir</span></strong><span class="muted">Compartilhar&nbsp; · &nbsp;Fila (3)</span></div><div class="stage-layout"><div class="stage-main"><div class="video"><div class="play">▶</div><div class="vid-bottom"><div class="bar"></div><div class="controls"><span>Ⅱ &nbsp; ◀ &nbsp; ▶ &nbsp; ♪ &nbsp; 01:26 / 05:14</span><span>◌ &nbsp; ⛶</span></div></div></div><div class="meta"><div><strong>Música para a noite</strong><small>Reproduzindo para toda a Party · YouTube</small></div><button class="btn">Ver fila</button></div></div><aside class="social"><h3>Na Party <span class="muted">· 4</span></h3>${avatars}<div class="msg"><span class="avatar a2">M</span><p><b>Maya</b><br>Essa parte é muito boa!</p></div><div class="msg"><span class="avatar a3">B</span><p><b>Bia</b><br>Deixa tocar mais uma?</p></div><div class="msg"><span class="avatar">D</span><p><b>Duck</b><br>Claro 🍃</p></div><div class="compose">Escreva uma mensagem… &nbsp; ↗</div></aside></div></main>`,'4 pessoas')}
function games(){return shell('Jogos de domingo',`<main class="g-hub"><div class="frame"><span class="caps">JOGOS DA PARTY</span><h1>Escolha a brincadeira.</h1><section class="game-feature"><div class="game-copy"><span class="caps">CRIAR JUNTOS</span><h2>Desenhe e<br>Adivinhe</h2><p>Um traço de cada vez. Vale errar, rir e tentar outra vez.</p><button class="btn primary">Começar a desenhar ↗</button></div><div class="game-art"><span>✏️</span></div></section><div class="game-other"><div class="game-line"><div><strong>Quiz da turma</strong><p>Perguntas rápidas para todo mundo.</p></div><button class="btn icon">Jogar ↗</button></div><div class="game-line"><div><strong>Lumio Cartas</strong><p>Uma rodada depois da outra.</p></div><button class="btn icon">Jogar ↗</button></div></div></div></main>`,'4 pessoas')}
function draw(drawer){const side=`<aside class="draw-side"><span class="caps">${drawer?'FERRAMENTAS':'NA MESA'}</span>${drawer?'<div class="toolbox"><span>✏</span><span>▰</span><span>◯</span><span>↶</span><span>⌫</span><span>⋯</span></div><div class="colors"><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="score">Cor · traço 8 px</span>':'<strong>Todo mundo adivinha</strong><span class="score">A resposta aparece aqui quando a rodada terminar.</span>'}${avatars}<span class="score">Duck · 42 pts<br>Maya · 30 pts<br>Bia · 22 pts</span></aside>`; const chat=`<aside class="draw-chat"><h3>Palpites e conversa</h3><div class="msg"><span class="avatar a2">M</span><p><b>Maya</b><br>É um animal?</p></div><div class="msg"><span class="avatar a3">B</span><p><b>Bia</b><br>galinha</p></div><div class="msg"><span class="avatar">D</span><p><b>Lumio</b><br>Bia chegou perto!</p></div><div class="compose">${drawer?'Fale com a turma…':'Seu palpite ou mensagem…'} &nbsp; ↗</div></aside>`;return shell('Jogos / Desenhe e Adivinhe',`<main class="party"><div class="draw-top"><strong>Desenhe e Adivinhe</strong><span class="muted desktop-only">Rodada 3 de 6</span><span class="turn">${drawer?'Sua vez de desenhar':'Duck está desenhando'}</span><span class="time">⏱ 46s</span></div><div class="draw-grid">${side}<div class="canvas-wrap"><div class="word"><strong>${drawer?'Você desenha: GALINHA':'_ A _ I _ H A'}</strong><span class="muted">Dica disponível</span></div><div class="board"><span class="sketch">🐔</span></div></div>${chat}</div></main>`,'4 jogadores')}
let html=id==='CS01'||id==='CS02'?home():id==='CS03'||id==='CS04'?media():id==='CS05'||id==='CS06'?games():draw(id==='CS07'||id==='CS09');document.getElementById('root').innerHTML=html;
const sketch='<svg class="sketch-svg" viewBox="0 0 420 300" aria-label="Traços ilustrativos no quadro"><path d="M91 170c-23-26-30-63-5-77 7 20 17 27 23 32-10-29-6-52 7-57 10 24 17 30 30 36 14-19 37-23 54-19 20-22 50-20 66 0 32-5 58 21 56 52 19 25 20 61 1 90-25 38-79 49-128 37-46-11-81-47-104-94Z"/><path d="M281 112c14-33 41-33 51-14l-6 26 31 24-33 10-10-12M236 92c-3-26 17-33 24-13 9-24 27-22 28 2 19-12 31-1 22 18M163 170c25-34 74-30 102-8-12 36-50 58-87 43M194 258l-6 28-24 12m24-12 20 12m86-52 8 38-20 14m20-14 23 12"/><circle class="eye" cx="309" cy="118" r="4"/></svg>';
document.querySelectorAll('.board .sketch').forEach(node=>node.outerHTML=sketch);
document.querySelectorAll('.game-art span').forEach(node=>{node.textContent='✎'});
document.querySelectorAll('.draw-chat .msg:nth-of-type(2) p').forEach(node=>{node.innerHTML='<b>Bia</b><br>galina'});
</script></body></html>
